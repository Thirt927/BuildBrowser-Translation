name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Panorama simulator
        run: node tests/translate_simtest.js
      - name: Toolchain round-trips
        run: node tests/tools_simtest.js
      - name: Scene verification (real override layouts)
        run: node tests/scene_verify.js
      - name: Translation follows the shown build
        run: node tests/refresh_verify.js
      - name: Sentence-level fallback
        run: node tests/fragment_verify.js
      - name: Live bridge channel
        run: node tests/live_channel_simtest.js
      - name: Growing translation table
        run: node tests/tm_table_simtest.js
      - name: Toolbar button and language modes
        run: node tests/ui_button_simtest.js
      - name: Layout token table is in sync
        run: node tools/build_layout_tokens.js --check
